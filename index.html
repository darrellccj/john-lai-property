<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>John Lai Property — Four Directions</title>
<meta name="description" content="Four design directions for the John Lai property site." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#14110f; --ink-soft:#5b544e; --paper:#f7f4ef; --line:#e0d9d0;
    --card:#fffdfa; --accent:#b0402f;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"DM Sans",system-ui,-apple-system,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(2.5rem,7vw,6rem) clamp(1.25rem,5vw,3rem)}
  .eyebrow{
    font-family:"DM Mono",ui-monospace,monospace; font-size:.7rem; letter-spacing:.22em;
    text-transform:uppercase; color:var(--accent); margin:0 0 1.25rem;
  }
  h1{
    font-family:"Playfair Display",Georgia,serif; font-weight:600;
    font-size:clamp(2.4rem,7vw,4.4rem); line-height:1.04; letter-spacing:-.02em; margin:0 0 1.25rem;
  }
  h1 em{font-style:italic; color:var(--accent)}
  .lede{font-size:clamp(1rem,2.2vw,1.15rem); color:var(--ink-soft); max-width:46ch; margin:0}
  .rule{height:1px;background:var(--line);margin:clamp(2.5rem,6vw,4rem) 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:clamp(1rem,2.5vw,1.5rem)}
  .card{
    display:flex; flex-direction:column; gap:.75rem; position:relative;
    background:var(--card); border:1px solid var(--line); border-radius:2px;
    padding:clamp(1.5rem,3vw,2rem); text-decoration:none; color:inherit;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-4px); border-color:var(--ink);
    box-shadow:0 14px 40px -18px rgba(20,17,15,.45); outline:none;
  }
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .num{
    font-family:"DM Mono",monospace; font-size:.7rem; letter-spacing:.2em; color:var(--ink-soft);
  }
  .card h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:1.75rem;line-height:1.2;margin:.25rem 0 0}
  .go{margin-top:auto;padding-top:1.75rem;font-size:.85rem;font-weight:500;color:var(--accent)}
  footer{
    margin-top:clamp(3rem,7vw,5rem); padding-top:1.5rem; border-top:1px solid var(--line);
    font-family:"DM Mono",monospace; font-size:.72rem; letter-spacing:.08em; color:var(--ink-soft);
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#f2ede6;--ink-soft:#a49b91;--paper:#141210;--line:#2e2925;--card:#1c1917;--accent:#e0705a}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">John Lai · Property · Singapore</p>
    <h1>Four ways to<br />say the <em>same thing.</em></h1>
    <p class="lede">Four design directions for the same property site. Open any of them — they are all fully live.</p>

    <div class="rule"></div>

    <div class="grid">
      <a class="card" href="v6/">
        <span class="num">01</span>
        <h2>Option 1</h2>
        <span class="go">View this option &rarr;</span>
      </a>
      <a class="card" href="v5/">
        <span class="num">02</span>
        <h2>Option 2</h2>
        <span class="go">View this option &rarr;</span>
      </a>
      <a class="card" href="v4/">
        <span class="num">03</span>
        <h2>Option 3</h2>
        <span class="go">View this option &rarr;</span>
      </a>
      <a class="card" href="v3/">
        <span class="num">04</span>
        <h2>Option 4</h2>
        <span class="go">View this option &rarr;</span>
      </a>
    </div>

  </main>
</body>
</html>
